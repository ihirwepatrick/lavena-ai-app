# Supabase local development — see https://supabase.com/docs/guides/cli

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = false

# Enable Google in Supabase Dashboard → Authentication → Providers
# and add credentials from Google Cloud Console.
